; Process manager for the in-container Pixoo stack.
; mosquitto self-drops to the mosquitto user; bootstrap runs as root ONLY to
; bind port 80 (minimal, hardened service); heartbeat + web run as the
; unprivileged 'pixoo' user.
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mosquitto]
command=/usr/sbin/mosquitto -c /opt/pixoo-local/docker/mosquitto.conf
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bootstrap]
command=python3 -m bootstrap.app
directory=/opt/pixoo-local
priority=20
autostart=true
autorestart=true
startsecs=3
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:heartbeat]
command=python3 -m mqtt.heartbeat
directory=/opt/pixoo-local
priority=30
autostart=true
autorestart=true
startsecs=3
user=pixoo
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=python3 -m web.app
directory=/opt/pixoo-local
priority=40
autostart=true
autorestart=true
startsecs=3
user=pixoo
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:editor]
command=python3 -m web.editor
directory=/opt/pixoo-local
priority=50
autostart=true
autorestart=true
startsecs=3
user=pixoo
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
