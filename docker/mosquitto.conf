# =====================================================================
# Dedicated Pixoo Mosquitto broker — runs INSIDE the macvlan container.
# Completely isolated from the host's shared Mosquitto (which we never touch).
# LAN-only (the container has no WAN route to the Pixoo's Omada deny anyway),
# authenticated, ACL-restricted to the Pixoo device topics.
# passwd/acl are generated at container start by entrypoint.sh from the secret
# files, so no credentials live in this file or in git.
# =====================================================================

per_listener_settings false

persistence true
persistence_location /var/lib/mosquitto/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Bind on all interfaces of the container's own network namespace -> this maps
# to the dedicated LAN IP (advertise_ip) + loopback only.
listener 1883 0.0.0.0
allow_anonymous false
password_file /run/pixoo/passwd
acl_file /run/pixoo/acl
