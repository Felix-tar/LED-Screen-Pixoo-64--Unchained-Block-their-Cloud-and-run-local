# =====================================================================
# pixoo-local — isolated Pixoo stack on a dedicated LAN IP via macvlan.
# The container gets its own MAC + IP on the LAN, so it binds port 80 and
# 1883 WITHOUT any conflict with the host's Pi-hole (:80) or shared Mosquitto
# (:1883). Host networking, Pi-hole and eth0 config are never modified.
#
# Values are overridable via a sibling .env file (written by scripts/install.sh):
#   PIXOO_PARENT_IF   default eth0
#   PIXOO_ADVERTISE_IP default 10.10.20.160   (must be reserved/excluded on the
#                                              DHCP server 10.10.20.231)
#   PIXOO_SUBNET      default 10.10.20.0/24
#   PIXOO_GATEWAY     default 10.10.20.254
# =====================================================================
services:
  pixoo-local:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pixoo-local:latest
    container_name: pixoo-local
    hostname: pixoo-local
    restart: unless-stopped
    # Fixed, locally-administered MAC (02: = local bit set; 0a:0a:14:a0 = 10.10.20.160)
    # so the container's L2 identity is stable across recreation (steady ARP on the
    # Omada switch / Synology). Verified free in ARP before assignment.
    mac_address: "${PIXOO_MAC:-02:42:0a:0a:14:a0}"
    networks:
      pixoo_macvlan:
        ipv4_address: "${PIXOO_ADVERTISE_IP:-10.10.20.160}"
    volumes:
      - /opt/pixoo-local:/opt/pixoo-local
      - /etc/pixoo-local:/etc/pixoo-local:ro
    tmpfs:
      - /run:mode=0755
    environment:
      PIXOO_CONFIG: /opt/pixoo-local/config/config.yaml
      PIXOO_SECRETS_DIR: /etc/pixoo-local
      PIXOO_STATUS_DIR: /run/pixoo/status
      PIXOO_RUN_DIR: /run/pixoo
      PIXOO_LOG_LEVEL: "${PIXOO_LOG_LEVEL:-INFO}"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bootstrap binds port 80
      - SETUID             # supervisord/mosquitto drop privileges
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  pixoo_macvlan:
    name: pixoo_macvlan
    driver: macvlan
    driver_opts:
      parent: "${PIXOO_PARENT_IF:-eth0}"
    ipam:
      config:
        - subnet: "${PIXOO_SUBNET:-10.10.20.0/24}"
          gateway: "${PIXOO_GATEWAY:-10.10.20.254}"
